# Render Blueprint for the Color Claim online server (see SERVER.md).
# Render -> New -> Blueprint -> pick this repository; it reads this file.
services:
  - type: web
    name: color-claim-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    # free: sleeps after ~15 minutes with nobody playing, and the first player then waits up to a
    # minute while it wakes (the game waits and says so). Change to "starter" (US$7 a month)
    # for a server that's always awake
    plan: free
    region: singapore # pick the region closest to most of your players
    autoDeploy: true
    branch: claude/game-ideas-brainstorm-g3f06o
