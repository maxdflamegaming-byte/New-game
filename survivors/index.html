<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Glow Survivors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="bars">
      <div class="bar hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
      <div class="bar xp"><div id="xp-fill"></div><span id="lvl-text"></span></div>
    </div>
    <div class="stats">
      <span id="time-text">0:00</span>
      <span id="kills-text">0 kills</span>
    </div>
  </div>

  <div id="banner"></div>

  <div id="menu" class="screen show">
    <h1>Glow Survivors</h1>
    <p>Survive the swarm. Your magic fires on its own. All you do is move!</p>
    <p class="small">Move: WASD / Arrow keys &middot; Touch: drag anywhere &middot; Pause: P</p>
    <p class="small">Best time: <b id="menu-best">0:00</b></p>
    <button id="play-btn">Play</button>
  </div>

  <div id="levelup" class="screen">
    <h2>Level up!</h2>
    <p class="small">Pick an upgrade (or press 1, 2, 3)</p>
    <div id="cards"></div>
  </div>

  <div id="paused" class="screen">
    <h2>Paused</h2>
    <button id="resume-btn">Resume</button>
  </div>

  <div id="over" class="screen">
    <h2>Game Over</h2>
    <p id="over-stats"></p>
    <p id="over-best" class="small"></p>
    <button id="again-btn">Play again</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
