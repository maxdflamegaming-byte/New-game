# Fly.io config for the Color Claim online server (see SERVER.md). `fly launch` reads this.
app = "color-claim-server"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # stopping would drop everyone's games
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
